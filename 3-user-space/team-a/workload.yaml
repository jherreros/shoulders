apiVersion: shoulders.io/v1alpha1
kind: Workload
metadata:
  name: team-a-loadgenerator
  namespace: team-a
spec:
  type: cronjob
  image: curlimages/curl
  tag: "8.11.1"
  schedule: "*/5 * * * *"
  args:
    - -fsS
    - http://team-a-instance
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    # The curl image declares USER curl_user, not a uid. runAsNonRoot alone
    # cannot verify a non-numeric user, so the kubelet refuses the container:
    #
    #   container has runAsNonRoot and image has non-numeric user (curl_user),
    #   cannot verify user is non-root
    #
    # Naming the uid (curl_user is 100 in this image) makes the check decidable.
    runAsUser: 100