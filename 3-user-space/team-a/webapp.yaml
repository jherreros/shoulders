apiVersion: shoulders.io/v1alpha1
kind: WebApplication
metadata:
  name: team-a-instance
  namespace: team-a
spec:
  # nginx-unprivileged runs as uid 101 and listens on 8080 out of the box, so it
  # satisfies the runAsNonRoot contract below. The stock nginx image runs as
  # root and would be rejected by the kubelet.
  image: nginxinc/nginx-unprivileged
  tag: 1.27-alpine
  replicas: 2
  # The platform sets SHOULDERS_WORKLOAD_DOMAIN per cluster — on a spoke it is
  # <spoke>.<hub domain> — so this app is team-a.<cluster>.<domain> rather than
  # a name that only works in one place.
  host: team-a.${SHOULDERS_WORKLOAD_DOMAIN}
  port: 8080
  env:
    - name: LOG_LEVEL
      value: info
  envFrom:
    # Optional while the sample runs without user-supplied configuration. The
    # SOPS example turns this into a real secret; making it required now would
    # leave the reference app in CreateContainerConfigError on a fresh install.
    - secretRef:
        name: team-a-app-config
        optional: true
  readinessProbe:
    httpGet:
      path: /
      port: 8080
  livenessProbe:
    httpGet:
      path: /
      port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
