apiVersion: v1
kind: ConfigMap
metadata:
  name: shoulders-platform-config
  namespace: flux-system
data:
  SHOULDERS_PROFILE: large
  SHOULDERS_POSTGRES_INSTANCES: "2"
  SHOULDERS_KAFKA_REPLICAS: "3"
  SHOULDERS_KAFKA_MIN_ISR: "2"
  SHOULDERS_KAFKA_STORAGE: 1Gi
  SHOULDERS_METRICS_RETENTION: 7d
  # Leave 15GiB free on the 20Gi PVC: roughly a 5GiB data budget.
  SHOULDERS_METRICS_MIN_FREE_DISK: 15GiB
