# The large profile includes the full observability set.
#
# Stated explicitly rather than inherited from the base manifests, so the
# profile's intent is legible where the profile is defined. See R5 in
# docs/multi-cluster-target.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  values:
    dashboards:
      enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        dashboards:
          enabled: true
