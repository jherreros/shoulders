apiVersion: v1
kind: ConfigMap
metadata:
  name: shoulders-platform-config
  namespace: flux-system
data:
  SHOULDERS_PROFILE: small
  SHOULDERS_POSTGRES_INSTANCES: "1"
  SHOULDERS_KAFKA_REPLICAS: "1"
  SHOULDERS_KAFKA_MIN_ISR: "1"
  SHOULDERS_KAFKA_STORAGE: 1Gi
  SHOULDERS_METRICS_RETENTION: 24h
  # Leave 1.5GiB free on the 2Gi PVC: roughly a 512MiB data budget.
  SHOULDERS_METRICS_MIN_FREE_DISK: 1536MiB
