apiVersion: v1
kind: Secret
metadata:
  name: oidc
  namespace: headlamp
type: Opaque
stringData:
  clientID: ${SHOULDERS_HEADLAMP_CLIENT_ID}
  clientSecret: ${SHOULDERS_HEADLAMP_CLIENT_SECRET}
  issuerURL: https://${SHOULDERS_DEX_HOST}
  scopes: openid,email,profile,groups
  callbackURL: ${SHOULDERS_HEADLAMP_CALLBACK_URL}
  validatorClientID: ${SHOULDERS_HEADLAMP_CLIENT_ID}
  validatorIssuerURL: https://${SHOULDERS_DEX_HOST}
  usePKCE: "true"
