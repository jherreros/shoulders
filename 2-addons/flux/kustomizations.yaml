---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  path: ./2-addons/manifests/headlamp
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: shoulders-platform-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-releases
  namespace: flux-system
spec:
  interval: 10m
  path: ./2-addons/manifests/helm-releases
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: shoulders-platform-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: helm-repositories
    - name: namespaces
    - name: crds
    - name: headlamp
---
