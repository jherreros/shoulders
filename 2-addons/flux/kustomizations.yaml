apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-repositories
  namespace: flux-system
spec:
  interval: 10m
  path: ./2-addons/manifests/helm-repositories
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
